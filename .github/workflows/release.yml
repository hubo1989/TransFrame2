# Release pipeline for TransFrame 2 (SPEC ADR-0014): tag v0.* or v2.* → universal signed and notarized DMG and Sparkle appcast.
# Publish first as a GitHub pre-release. Promotion makes the tested assets available via releases/latest/download/.
#
# Required repository secrets:
#   DEVELOPER_ID_P12_BASE64, DEVELOPER_ID_P12_PASSWORD   Developer ID Application certificate (.p12, base64)
#   APPLE_TEAM_ID, NOTARY_APPLE_ID, NOTARY_PASSWORD      notarytool credentials (app-specific password)
#   SPARKLE_PRIVATE_KEY                                  new TransFrame 2 EdDSA private key (Sparkle generate_keys -x)
# Required repository variable:
#   SPARKLE_PUBLIC_KEY                                   matching public key, written into Info.plist (SUPublicEDKey)
# Scripts/setup-release-secrets.sh sets all of them with the GitHub CLI.
name: release
on:
  push:
    tags: ["v0.*", "v2.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v0.* or v2.* tag to release"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app
      - name: Tools
        run: brew install xcodegen create-dmg
      - name: Gates
        run: |
          Scripts/check-deps.sh
          Scripts/check-l10n.sh
          Scripts/check-design.sh
          Scripts/test.sh package
      - name: Version from tag
        run: |
          [[ "$TAG" =~ ^v(0|2)\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid release tag: $TAG"; exit 1; }
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
      - name: Import signing certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"
      - name: Build universal Release
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          xcodegen generate
          xcodebuild -project TransFrame2.xcodeproj -scheme TransFrame2 -configuration Release \
            -destination 'generic/platform=macOS' ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Developer ID Application" \
            ENABLE_HARDENED_RUNTIME=YES OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime" CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            TF_SPARKLE_PUBLIC_KEY="$SPARKLE_PUBLIC_KEY" \
            SYMROOT="$PWD/build/Products" OBJROOT="$PWD/build/Intermediates" build
          APP="build/Products/Release/TransFrame 2.app"
          lipo -archs "$APP/Contents/MacOS/TransFrame 2" | grep -q "x86_64 arm64\|arm64 x86_64"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")" = "$BUILD"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$APP/Contents/Info.plist")"
      - name: Sign for notarization
        run: |
          # Sparkle's helpers ship ad hoc signed and Xcode only re-signs the framework, so sign inside out (Sparkle docs,
          # "Code signing"), then the app with its own entitlements (no get-task-allow).
          APP="build/Products/Release/TransFrame 2.app"
          SPARKLE="$APP/Contents/Frameworks/Sparkle.framework"
          ID="Developer ID Application"
          codesign -f -s "$ID" -o runtime --timestamp "$SPARKLE/Versions/B/XPCServices/Installer.xpc"
          codesign -f -s "$ID" -o runtime --timestamp --preserve-metadata=entitlements "$SPARKLE/Versions/B/XPCServices/Downloader.xpc"
          codesign -f -s "$ID" -o runtime --timestamp "$SPARKLE/Versions/B/Autoupdate"
          codesign -f -s "$ID" -o runtime --timestamp "$SPARKLE/Versions/B/Updater.app"
          codesign -f -s "$ID" -o runtime --timestamp "$SPARKLE"
          codesign -f -s "$ID" -o runtime --timestamp --entitlements App/TransFrame2.entitlements "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Every Mach-O: Developer ID of the app's team, secure timestamp, hardened runtime; and no get-task-allow.
          team=$(codesign -dv "$APP" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          bad=0
          while IFS= read -r -d '' f; do
            file -b "$f" | grep -q "Mach-O" || continue
            info=$(codesign -dvv "$f" 2>&1)
            if ! grep -q "^Authority=Developer ID Application" <<<"$info" || ! grep -q "^TeamIdentifier=$team$" <<<"$info" \
               || ! grep -q "^Timestamp=" <<<"$info" || ! grep -q "(runtime)" <<<"$info"; then
              echo "::error::not ready for notarization: ${f#"$APP"/}"; bad=1
            fi
          done < <(find "$APP" -type f -print0)
          if codesign -d --entitlements - --xml "$APP" 2>/dev/null | grep -q "get-task-allow"; then echo "::error::get-task-allow entitlement"; bad=1; fi
          exit "$bad"
      - name: DMG
        run: |
          create-dmg --volname "TransFrame 2" --app-drop-link 480 160 --window-size 640 360 --icon "TransFrame 2.app" 160 160 \
            "build/TransFrame-2-$VERSION.dmg" "build/Products/Release/TransFrame 2.app"
          codesign --sign "Developer ID Application" --timestamp "build/TransFrame-2-$VERSION.dmg"
      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "build/TransFrame-2-$VERSION.dmg" --apple-id "$APPLE_ID" --password "$PASSWORD" --team-id "$TEAM_ID" \
            --wait --output-format json > build/notary.json || true
          cat build/notary.json
          ID=$(plutil -extract id raw -o - build/notary.json 2>/dev/null || true)
          STATUS=$(plutil -extract status raw -o - build/notary.json 2>/dev/null || true)
          if [ "$STATUS" != "Accepted" ]; then
            # Apple's reasons (which file, which rule) — the log holds no secrets.
            [ -n "$ID" ] && xcrun notarytool log "$ID" --apple-id "$APPLE_ID" --password "$PASSWORD" --team-id "$TEAM_ID"
            echo "::error::notarization status: ${STATUS:-unknown}"; exit 1
          fi
          xcrun stapler staple "build/TransFrame-2-$VERSION.dmg"
          xcrun stapler validate "build/TransFrame-2-$VERSION.dmg"
      - name: Sparkle appcast (minimumSystemVersion 15.0)
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SIGN_UPDATE=$(find build -path '*Sparkle*/bin/sign_update' -type f | head -1)
          [ -n "$SIGN_UPDATE" ] || SIGN_UPDATE=$(find ~/Library/Developer/Xcode/DerivedData -path '*artifacts*sparkle*/bin/sign_update' -type f | head -1)
          SIG=$(echo "$SPARKLE_PRIVATE_KEY" | "$SIGN_UPDATE" --ed-key-file - "build/TransFrame-2-$VERSION.dmg")
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/TransFrame-2-$VERSION.dmg"
          cat > build/appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>TransFrame 2</title>
              <item>
                <title>$VERSION</title>
                <pubDate>$(date -R)</pubDate>
                <sparkle:version>$BUILD</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>15.0</sparkle:minimumSystemVersion>
                <sparkle:releaseNotesLink>https://github.com/${{ github.repository }}/releases/tag/$TAG</sparkle:releaseNotesLink>
                <enclosure url="$URL" type="application/octet-stream" $SIG />
              </item>
            </channel>
          </rss>
          XML
          grep -q 'sparkle:edSignature' build/appcast.xml
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="$VERSION" '/^## / { if (found) exit; found = ($2 == v); next } found' CHANGELOG.md > build/notes.md
          [ -s build/notes.md ] || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
          gh release create "$TAG" "build/TransFrame-2-$VERSION.dmg" build/appcast.xml --title "TransFrame 2 $VERSION" \
            --notes-file build/notes.md --verify-tag --prerelease --latest=false
